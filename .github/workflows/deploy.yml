name: Build and Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: gcp-cicd-lab
  REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Google Auth
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1

    - name: Authorize Docker push
      run: gcloud auth configure-docker --quiet

    - name: Build Docker Image
      run: |-
        docker build -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/gcp-cicd-lab/my-app:${{ github.sha }} .

    - name: Push Docker Image to Artifact Registry
      run: |-
        docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/gcp-cicd-lab/my-app:${{ github.sha }}

    - name: Deploy to Cloud Run
      run: |-
        gcloud run deploy my-app \
          --image us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/gcp-cicd-lab/my-app:${{ github.sha }} \
          --region us-central1 \
          --platform managed \
          --allow-unauthenticated